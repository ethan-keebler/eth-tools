[project]
name = "pdf-split-gui"
version = "0.1.0"
description = "Personal tkinter + pymupdf tool to page through PDFs and split on page breaks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
]

[project.scripts]
pdf-split-gui = "pdf_split_gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
